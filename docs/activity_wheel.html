  .sector.highlighted .hit, .sector:focus-visible .hit { fill-opacity: 0.18; }
  .sector:focus-visible .hit { stroke: var(--text); stroke-width: 1.5; }
  .sector text { fill: var(--text); dominant-baseline: central; }
  footer {
    width: min(96vw, calc(100vh - 3.5rem)); display: flex; justify-content: space-between;
    gap: 1rem; font-size: 0.8rem; opacity: 0.85; padding: 0.4rem 0;
  }
  footer a { color: inherit; }
</style>

    for (const [id, link] of sectorLinks) {

  }

  function dayUrl(date) {
    return `${DATA.day_page}#${encodeURIComponent(date)}`;
  }

  // Text follows an arc; the lower half runs counterclockwise so its letters stay upright.
  function arcLabel(group, id, text, mid, span, radius, reverse) {
    const half = span / 2;
    element("path", {
      id, fill: "none",
      d: reverse ? arc(mid + half, mid - half, radius) : arc(mid - half, mid + half, radius),
    }, group);
    const label = element("text", {"font-size": BASE_FONT, "text-anchor": "middle"}, group);
    const path = element("textPath", {href: `#${id}`, startOffset: "50%"}, label);
    path.textContent = text;
    const available = 0.9 * span * radius * SCALE;
    const width = label.getComputedTextLength();
    if (width > available) {
      const size = BASE_FONT * available / width;
      if (size < 1.5) label.remove();
      else label.setAttribute("font-size", size.toFixed(2));
    }
  }

  const {base, peak, label: labelRadius} = DATA.radii;

  element("circle", {
    cx: CENTER, cy: CENTER, r: fmt(MAP_RADIUS * SCALE),
    fill: "none", stroke: theme.border, "stroke-width": 3,
  });

  // Totals sector at 12 o'clock
  const half = DATA.summary_span / 2;
  element("path", {d: annulus(-half, half, base, peak), fill: theme.summary, stroke: theme.border});
  const [sx, sy] = polar(0, (base + peak) / 2);
  const summary = element("text", {
    x: fmt(sx), y: fmt(sy - BASE_FONT * 1.25 * (DATA.summary.length - 1) / 2), "font-size": BASE_FONT,
    "text-anchor": "middle", "dominant-baseline": "central", fill: theme.text,
  });
  DATA.summary.forEach((line, index) => {
    const span = element("tspan", {x: fmt(sx), dy: index ? "1.25em" : 0}, summary);
    span.textContent = line;
  });

  DATA.sectors.forEach((sector, index) => {
    const {start, end} = sector;
    const divider = start - DATA.gap / 2;
    const [x1, y1] = polar(divider, base);
    const [x2, y2] = polar(divider, peak);
    element("line", {
      x1: fmt(x1), y1: fmt(y1), x2: fmt(x2), y2: fmt(y2),
      stroke: theme.divider, "stroke-width": 1.2, "stroke-dasharray": "5 4",
    });

    const link = element("a", {
      class: "sector", href: dayUrl(sector.date),
      "data-ride-id": sector.ride_id,
      "aria-label": `${sector.label}, ${sector.stats}. Open day view.`,
    });
    sectorLinks.set(sector.ride_id, link);
    link.addEventListener("mouseenter", () => hoverRide(sector.ride_id));
    link.addEventListener("mouseleave", () => leaveRide(sector.ride_id));
    link.addEventListener("focus", () => { focusedRide = sector.ride_id; updateHighlight(); });
    link.addEventListener("blur", () => { focusedRide = null; updateHighlight(); });
    element("title", {}, link).textContent = `${sector.label}\n${sector.stats}\nClick to explore this day`;
    element("path", {class: "hit", d: annulus(start, end, base, labelRadius + 0.13), fill: sector.color}, link);

    const count = sector.profile.length;
    const thetas = sector.profile.map((_, i) => start + (end - start) * i / Math.max(count - 1, 1));
    const top = sector.profile.map((value, i) => point(thetas[i], base + value * (peak - base)));
    const bottom = thetas.slice().reverse().map(theta => point(theta, base));
    element("path", {d: `M${top.join("L")}L${bottom.join("L")}Z`, fill: sector.color, "fill-opacity": 0.45}, link);
    element("path", {d: `M${top.join("L")}`, fill: "none", stroke: sector.color, "stroke-width": 2.6}, link);

    const mid = (start + end) / 2;
    const reverse = Math.cos(mid) < 0;
    const [dateRadius, statsRadius] = reverse ? [labelRadius, labelRadius + 0.08] : [labelRadius + 0.08, labelRadius];
    arcLabel(link, `label-${index}`, sector.label, mid, end - start, dateRadius, reverse);
    arcLabel(link, `stats-${index}`, sector.stats, mid, end - start, statsRadius, reverse);
  });

  // Overview map inside the centre circle; the SVG viewBox is 1000 units wide, so 10 units = 1 %.
  const mapElement = document.getElementById("center-map");
  const offset = (CENTER - MAP_RADIUS * SCALE) / 10;
  const diameter = MAP_RADIUS * SCALE / 5;
  Object.assign(mapElement.style, {left: `${offset}%`, top: `${offset}%`, width: `${diameter}%`, height: `${diameter}%`});
  const map = L.map(mapElement, {
    zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, zoomSnap: 0.25,
  });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19}).addTo(map);
  const routes = L.featureGroup().addTo(map);
  for (const ride of DATA.rides) {
    const openDay = () => { window.location.href = dayUrl(ride.date); };
    const layers = [];
    rideLayers.set(ride.id, layers);
    const addRoute = (points, options, tooltip) => {
      const layer = L.polyline(points, {
        color: ride.color, weight: 3, opacity: 0.95, className: `ride-route ride-${ride.id}`, ...options,
      })
        .bindTooltip(tooltip, {sticky: true})
        .on("mouseover", () => hoverRide(ride.id))
        .on("mouseout", () => leaveRide(ride.id))
        .on("click", openDay)
        .addTo(routes);
      layers.push(layer);
    };
    for (const track of ride.tracks) {
      if (track.length > 1) {
        addRoute(track, {}, `${ride.date} · ${ride.name}`);
      }
    }
    for (const line of ride.transit) {
      addRoute(line, {dashArray: "1 6", lineCap: "round"}, `${ride.date} · ${ride.name} · train/ferry`);
    }
    for (const end of ride.ends) {
      L.circleMarker(end, {
        radius: 2.5, stroke: false, fillColor: "black", fillOpacity: 1, interactive: false,
      }).addTo(routes);
    }
  }
  const fit = () => {
    map.invalidateSize();
    const padding = mapElement.clientWidth * 0.16;
    map.fitBounds(routes.getBounds(), {padding: [padding, padding], animate: false});
  };
  fit();
  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
